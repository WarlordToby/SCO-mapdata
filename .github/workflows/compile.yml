name: Compile city pack

on:
  workflow_dispatch:
    inputs:
      city:
        description: City name (used for geocoding and the pack name)
        required: true
        default: Strasbourg
      country:
        description: ISO 3166-1 alpha-2 country code (helps geocoding)
        required: false
        default: FR
      lat:
        description: Centre latitude (optional, overrides geocoding)
        required: false
      lon:
        description: Centre longitude (optional, overrides geocoding)
        required: false
      radius_km:
        description: Half-width of the square pack area in km
        required: false
        default: '6'

permissions:
  contents: write

concurrency:
  group: compile-packs
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - run: npm ci
      - name: Download OSM + elevation
        env:
          CITY: ${{ inputs.city }}
          COUNTRY: ${{ inputs.country }}
          LAT: ${{ inputs.lat }}
          LON: ${{ inputs.lon }}
          RADIUS: ${{ inputs.radius_km }}
        run: node pipeline/fetch.mjs --city "$CITY" --country "$COUNTRY" --lat "$LAT" --lon "$LON" --radius "$RADIUS" --out work
      - name: Compile pack
        run: node --max-old-space-size=6000 compiler/compile.mjs --work work --out packs
      - name: Commit pack
        env:
          CITY: ${{ inputs.city }}
        run: |
          git config user.name "sco-mapdata-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Compile city pack: $CITY"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: area-info
          path: work/area.json
